version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: naturequest-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://naturequest:naturequest123@db:5432/naturequest_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - SECRET_KEY=${SECRET_KEY:-naturequest-secret-key-prod-2026}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: naturequest-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: naturequest-postgres
    restart: always
    environment:
      POSTGRES_USER: naturequest
      POSTGRES_PASSWORD: naturequest123
      POSTGRES_DB: naturequest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
